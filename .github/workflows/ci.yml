name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: projecthouse
          POSTGRES_PASSWORD: projecthouse_dev
          POSTGRES_DB: projecthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projecthouse -d projecthouse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://projecthouse:projecthouse_dev@localhost:5432/projecthouse
      TEST_DATABASE_URL: postgresql+asyncpg://projecthouse:projecthouse_dev@localhost:5432/projecthouse_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Exactly one Alembic head
        run: test "$(alembic heads | grep -c '(head)')" -eq 1
      - name: Migrations apply to an empty database
        run: alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose build
