# Local development database. Production uses Neon (managed PostgreSQL 18).
name: prostagram
services:
  db:
    image: postgres:18
    container_name: prostagram-db
    environment:
      POSTGRES_USER: prostagram
      POSTGRES_PASSWORD: prostagram_dev
      POSTGRES_DB: prostagram
    ports:
      - "55433:5432"
    volumes:
      - prostagram-db:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  prostagram-db:
